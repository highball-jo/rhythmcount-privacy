<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RhythmCount — Privacy Policy</title>

<!--
  This page is a redirect, not a policy.

  RhythmCount's privacy policy is maintained in exactly one place:
  https://rhythmcount.jocoding.io/privacy — the canonical host, the one the App
  Store listing points at, and the one on the domain that serves app-ads.txt.

  This URL exists because the Google Play listing and its Data Safety
  deletion-request link were set to it before the canonical page covered
  Android. Both copies were accurate at that moment, which is exactly the
  situation that rots: two true documents drift into one true and one stale.
  Redirecting keeps every published URL working while leaving a single source
  of truth to maintain.

  The fragment survives: browsers carry #delete-data over to a target that
  specifies none, and the canonical page has a matching id="delete-data", so
  the Data Safety deletion link still lands on its section.
-->

<link rel="canonical" href="https://rhythmcount.jocoding.io/privacy">
<meta http-equiv="refresh" content="0; url=https://rhythmcount.jocoding.io/privacy">
<script>
  // Belt and braces: carry the fragment explicitly, so the deletion link lands
  // on its section even if a client drops it across the meta refresh.
  location.replace("https://rhythmcount.jocoding.io/privacy" + (location.hash || ""));
</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       max-width:40rem;margin:0 auto;padding:3rem 1.25rem;line-height:1.6;color:#111}
  a{color:#0026FC}
  @media(prefers-color-scheme:dark){body{background:#0d0d10;color:#ececf1}a{color:#7d92ff}}
</style>
</head>
<body>
<h1>RhythmCount — Privacy Policy</h1>
<p>This policy has moved to
<a href="https://rhythmcount.jocoding.io/privacy">rhythmcount.jocoding.io/privacy</a>.</p>
<p>You should be redirected automatically. If not, follow the link above.</p>
</body>
</html>
